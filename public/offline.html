<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ইন্টারনেট নেই</title>
  <style>
    body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:#111827; color:#f3f4f6;
           font-family:'Noto Sans Bengali','Nirmala UI','Kalpurush',system-ui,sans-serif; text-align:center; padding:20px; }
    .box { max-width:360px; } h1 { font-size:1.3rem; margin:10px 0; } p { color:#9ca3af; line-height:1.7; }
    button { margin-top:14px; padding:12px 22px; border:0; border-radius:10px; background:#f59e0b; color:#111827; font-size:1rem; font-weight:600; cursor:pointer; }
  </style>

<body>
  <div class="box">
    <div style="font-size:3rem">📡</div>
    <h1>ইন্টারনেট সংযোগ নেই</h1>
    <p>আপনার ডাটা নিরাপদ আছে। ইন্টারনেট চালু করে আবার চেষ্টা করুন।</p>
    <button onclick="location.reload()">আবার চেষ্টা করুন</button>
  </div>

</html>
